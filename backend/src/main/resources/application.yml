spring:
  application:
    name: airbnb-clone-backend
  profiles:
    active: dev
  jackson:
    default-property-inclusion: non_null

server:
  port: 8086

app:
  cors:
    # Comma-separated origin patterns. Override with the ALLOWED_ORIGINS env
    # var, e.g. ALLOWED_ORIGINS=https://airbnb-clone.vercel.app
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:*,https://*.vercel.app,https://*.netlify.app}

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:airbnb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:airbnb_clone}
    username: ${DB_USER:airbnb}
    password: ${DB_PASSWORD:airbnb}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
